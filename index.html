<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Связаться: WhatsApp и Telegram</title>
<style>
:root{color-scheme:dark;--or:#ff7a00;--or2:#ffb347;--ord:#b34f00;--bk:#0a0a0a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(700px 500px at 50% 0%,#2a1400 0%,#0a0a0a 65%);color:#fff;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;padding:24px;overflow-x:hidden;overflow-y:auto;perspective:1200px}
.orb{position:fixed;border-radius:50%;background:radial-gradient(circle at 30% 28%,var(--or2),var(--or) 45%,var(--ord) 80%);box-shadow:0 30px 60px rgba(255,122,0,.35),inset -12px -16px 30px rgba(0,0,0,.45);animation:fl 7s ease-in-out infinite}
.o1{width:120px;height:120px;top:8%;left:-30px}
.o2{width:70px;height:70px;bottom:10%;right:6%;animation-delay:-3s}
.o3{width:36px;height:36px;top:22%;right:12%;animation-delay:-5s}
@keyframes fl{50%{transform:translateY(-22px)}}
.scene{width:100%;max-width:380px;margin:auto;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease-out}
.card{position:relative;transform-style:preserve-3d;background:linear-gradient(160deg,#1c1c1c,#0d0d0d);border:1px solid rgba(255,122,0,.45);border-radius:28px;padding:34px 24px 26px;overflow:visible;text-align:center;box-shadow:0 0 0 1px #000,0 6px 0 #2b1600,0 12px 0 #1a0e00,0 40px 70px rgba(0,0,0,.7),0 0 60px rgba(255,122,0,.22)}
.card>*{transform:translateZ(30px)}
.hero{display:block;width:calc(100% + 48px);margin:-34px -24px 4px;border-radius:27px 27px 0 0;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent);transform:translateZ(20px)}
.badge{display:inline-block;transform:translateZ(50px);padding:6px 14px;border-radius:99px;background:rgba(255,122,0,.15);color:var(--or2);font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}
h1{margin:0 0 8px;font-size:28px;line-height:1.15;background:linear-gradient(180deg,#fff,var(--or2));-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0 0 26px;color:#b8b0a6;font-size:16px;line-height:1.45}
a.btn{display:flex;align-items:center;justify-content:center;gap:12px;padding:17px 20px;margin-bottom:20px;border-radius:18px;text-decoration:none;font-size:18px;font-weight:700;transform:translateZ(60px);transition:transform .12s,box-shadow .12s}
.wa{color:#1a0b00;background:linear-gradient(180deg,var(--or2),var(--or));box-shadow:0 8px 0 var(--ord),0 18px 28px rgba(255,122,0,.4)}
.tg{color:#fff;background:linear-gradient(180deg,#262626,#111);border:2px solid var(--or);box-shadow:0 8px 0 #5c2b00,0 18px 28px rgba(0,0,0,.6)}
.ch{color:var(--or2);background:linear-gradient(180deg,#1a1a1a,#0c0c0c);border:2px solid #6b3200;box-shadow:0 8px 0 #2b1600,0 18px 28px rgba(0,0,0,.6)}
.ch:active{box-shadow:0 2px 0 #2b1600,0 6px 12px rgba(0,0,0,.6)}
.ch svg{fill:var(--or2)}
a.btn:hover{transform:translateZ(75px) translateY(-2px)}
a.btn:active{transform:translateZ(60px) translateY(6px)}
.wa:active{box-shadow:0 2px 0 var(--ord),0 6px 12px rgba(255,122,0,.4)}
.tg:active{box-shadow:0 2px 0 #5c2b00,0 6px 12px rgba(0,0,0,.6)}
svg{width:26px;height:26px;flex:none}
.wa svg{fill:#1a0b00}.tg svg{fill:var(--or)}
@media (prefers-reduced-motion:reduce){.orb{animation:none}.scene{transition:none}}
</style>
</head>
